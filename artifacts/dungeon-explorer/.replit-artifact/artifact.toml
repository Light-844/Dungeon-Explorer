kind = "web"
previewPath = "/"
title = "Dungeon Explorer"
version = "1.0.0"
id = "artifacts/dungeon-explorer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25935

[services.development]
run = "pnpm --filter @workspace/dungeon-explorer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dungeon-explorer", "run", "build" ]
serve = "static"
publicDir = "artifacts/dungeon-explorer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25935"
BASE_PATH = "/"
